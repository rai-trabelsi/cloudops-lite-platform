apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudops-dashboard-ingress
  namespace: apps
spec:
  rules:
    - host: dashboard.cloudops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudops-dashboard-service
                port:
                  number: 80

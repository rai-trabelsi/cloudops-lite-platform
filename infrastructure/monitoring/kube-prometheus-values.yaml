grafana:
  enabled: true
  adminPassword: "admin123"
  defaultDashboardsEnabled: true

prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: 2GB
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 500m

alertmanager:
  enabled: false

prometheusOperator:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
